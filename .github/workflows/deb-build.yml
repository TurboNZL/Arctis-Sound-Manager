name: Build deb

# Follows the TurboNZL engine release spec (turboengine: release-pipeline + prebuilt-release).
#  - Versions are Year.Month.Update (2026.11.3); the update number counts up within the month and is picked here.
#    Every release is tagged v<version> and is a normal release: no pre-releases.
#  - Assets are lowercase: arctis-sound-manager-<version>-linux-all.deb
#  - Every push to a branch builds the .deb and keeps it as a workflow artifact (nothing is published). Branch pushes are used
#    rather than `pull_request` because a pull request opened by a workflow does not start pull_request runs (see
#    turboengine modules/prebuilt-release/MODULE.md, "Pull requests opened by a workflow").
#  - A push to main publishes a release. If the commit came from a merged pull request whose branch build is still there, has the
#    identical source tree and was stamped with the version that is next now, those files are published as they are and nothing
#    is built (scripts/ci/reuse-build.mjs). Anything else builds again.
#
# The release is created with the workflow token, which GitHub does not let start other workflows, so the older tag-triggered
# release.yaml (wheel, AUR tarball, PyPI chain) does not also run for the new v<version> tag.

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

# Branch builds run one at a time per branch (a newer push replaces the older build). Releases are one at a time for the whole
# repository, never cancelled mid-release: two runs would pick the same next version and the second would fail.
concurrency:
  group: build-${{ github.ref == 'refs/heads/main' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

jobs:
  version:
    name: Pick version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      reuse: ${{ steps.reuse.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: |
          Y=$(date -u +%Y)
          M=$(date -u +%-m)
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq "[.[].tagName | select(startswith(\"v$Y.$M.\")) | ltrimstr(\"v$Y.$M.\") | tonumber] | max // 0")
          N=$((LAST + 1))
          echo "version=$Y.$M.$N" >> "$GITHUB_OUTPUT"
          echo "Version $Y.$M.$N"
      - id: reuse
        name: Can a branch build be published as it is?
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            node scripts/ci/reuse-build.mjs --sha "$GITHUB_SHA" --version "${{ steps.pick.outputs.version }}" \
              --workflow deb-build.yml --event push >> "$GITHUB_OUTPUT"
          else
            echo "run=" >> "$GITHUB_OUTPUT"
          fi
      - name: Record what this build is
        run: |
          mkdir meta
          printf '{"version":"%s","sha":"%s","tree":"%s"}' "${{ steps.pick.outputs.version }}" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" > meta/meta.json
      - uses: actions/upload-artifact@v4
        with:
          name: build-meta
          path: meta/meta.json
          retention-days: 30

  deb:
    needs: version
    if: needs.version.outputs.reuse == ''
    name: Debian package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Stamp the version
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("pyproject.toml")
          s = p.read_text()
          s, n = re.subn(r'(?m)^version = ".*"$', 'version = "${{ needs.version.outputs.version }}"', s, count=1)
          assert n == 1, "no version line found in pyproject.toml"
          p.write_text(s)
          PY
      - name: Build the .deb
        run: bash debian/build-deb.sh
      - name: Name it
        run: |
          V="${{ needs.version.outputs.version }}"
          mkdir out
          cp "build/deb/arctis-sound-manager_${V}-1_all.deb" "out/arctis-sound-manager-${V}-linux-all.deb"
          dpkg-deb --info "out/arctis-sound-manager-${V}-linux-all.deb"
      # Artifacts are only the hand-over to the release job; people download from the Release.
      - uses: actions/upload-artifact@v4
        with:
          name: build-deb
          path: out/arctis-sound-manager-*-linux-all.deb
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 30 }}

  release:
    name: Publish release
    needs: [version, deb]
    # Runs when the build succeeded, or was skipped because a branch build is reused. Only for main.
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the files (built now)
        if: needs.version.outputs.reuse == ''
        uses: actions/download-artifact@v4
        with:
          pattern: build-deb
          merge-multiple: true
          path: files
      - name: Get the files (built on the branch)
        if: needs.version.outputs.reuse != ''
        run: |
          mkdir files
          gh run download "${{ needs.version.outputs.reuse }}" --repo "$GITHUB_REPOSITORY" -D files-all
          find files-all -type f ! -name meta.json -exec mv {} files/ \;
      - name: List what will be published
        run: ls -lh files
      - name: Create the release
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          SHORT="${GITHUB_SHA::7}"
          if [ -n "${{ needs.version.outputs.reuse }}" ]; then HOW="Published from the build the branch already made (run ${{ needs.version.outputs.reuse }})."; else HOW="Built from this commit."; fi
          gh release create "v$VERSION" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Arctis Sound Manager $VERSION" \
            --notes "Commit $SHORT. $HOW

          - **Debian / Ubuntu:** download the \`-linux-all.deb\`, then \`sudo apt install ./arctis-sound-manager-$VERSION-linux-all.deb\`."
      - name: Keep only the five newest releases
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName | test("^v20[0-9][0-9]\\."))) | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
